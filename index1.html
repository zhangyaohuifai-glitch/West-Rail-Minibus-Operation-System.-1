<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浚鍵管理有限公司｜西鐵小巴每月營運收支計算系統</title>
<!-- Firebase 9 UMD (Compat) CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-analytics-compat.js"></script>
<!-- SheetJS 函式庫（支援直接產生格式化 Excel .xlsx） -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans HK","Microsoft JhengHei",sans-serif;margin:0;padding:0;}

:root{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --text-secondary:#64748b;
  --border:#e2e8f0;
  --primary:#1e3a8a;
  --income-border:#10b981;
  --income-bg:#ecfdf5;
  --income-text:#065f46;
  --exp-border:#ef4444;
  --exp-bg:#fef2f2;
  --exp-text:#991b1b;
  --card-shadow:0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
}

body.dark{
  --bg:#0f172a;
  --card:#1e293b;
  --text:#f8fafc;
  --text-secondary:#94a3b8;
  --border:#334155;
  --primary:#3b82f6;
  --income-border:#059669;
  --income-bg:#064e3b;
  --income-text:#a7f3d0;
  --exp-border:#dc2626;
  --exp-bg:#7f1d1d;
  --exp-text:#fecaca;
  --card-shadow:0 4px 10px rgba(0,0,0,0.4);
}

body{
  background:var(--bg);
  color:var(--text);
  padding:16px 12px;
  font-size:15px;
  max-width:820px;
  margin:0 auto;
  transition: background 0.25s, color 0.25s;
}

.app-header{
  text-align:center;
  margin-bottom:16px;
  padding:18px;
  background:linear-gradient(135deg, #1e3a8a, #2563eb);
  color:white;
  border-radius:14px;
  box-shadow:0 8px 16px -4px rgba(37,99,235,0.3);
}
.app-header h1{font-size:22px;letter-spacing:1px;font-weight:700;}
.app-header p{font-size:13px;opacity:0.9;margin-top:4px;}

.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
  border:1px solid var(--border);
  box-shadow:var(--card-shadow);
}
.card-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:8px;
  border-bottom:2px solid var(--border);
  padding-bottom:8px;
}
.section-income .card-title{color:var(--income-text);border-color:var(--income-border);}
.section-exp .card-title{color:var(--exp-text);border-color:var(--exp-border);}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:580px){
  .grid-2{grid-template-columns:1fr;}
}

.input-group{margin-bottom:10px;}
.input-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:4px;
  color:var(--text-secondary);
}
input{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:8px;
  font-size:15px;
  background:var(--card);
  color:var(--text);
  transition: all 0.2s ease;
}
input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.15);}

.btn{
  padding:10px 16px;
  border:none;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition: all 0.2s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:#2563eb;color:white;}
.btn-success{background:#059669;color:white;}
.btn-excel{background:#107c41;color:white;}
.btn-warning{background:#f59e0b;color:white;}
.btn-google{background:#4285f4;color:white;padding:12px 24px;font-size:15px;}
.btn-theme{background:#475569;color:white;width:100%;}

.sum-box{
  padding:14px 16px;
  border-radius:10px;
  margin-top:12px;
  font-weight:700;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:16px;
}
.income-box{background:var(--income-bg);color:var(--income-text);border:1px solid var(--income-border);}
.exp-box{background:var(--exp-bg);color:var(--exp-text);border:1px solid var(--exp-border);}

.kpi-container{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  margin-bottom:14px;
}
@media(max-width:580px){
  .kpi-container{grid-template-columns:1fr;}
}
.kpi-card{
  padding:14px;
  border-radius:10px;
  text-align:center;
}
.kpi-title{font-size:12px;font-weight:600;opacity:0.85;margin-bottom:4px;}
.kpi-val{font-size:18px;font-weight:800;}
.kpi-income{background:var(--income-bg);color:var(--income-text);border:1px solid var(--income-border);}
.kpi-exp{background:var(--exp-bg);color:var(--exp-text);border:1px solid var(--exp-border);}
.kpi-profit{background:#f0fdfa;color:#0d9488;border:1px solid #14b8a6;}

.daily-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
  gap: 6px;
  margin-top: 10px;
  background: var(--bg);
  padding: 12px;
  border-radius: 8px;
  border: 1px dashed var(--border);
}
.daily-item label {
  font-size: 11px;
  margin-bottom: 2px;
  color: var(--text-secondary);
}
.daily-item input {
  padding: 6px 8px;
  font-size: 13px;
  text-align: right;
}

.month-selector{display:flex;gap:8px;}
.month-selector input{flex:1;}
.history-item{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
}
.history-item:hover{background:rgba(37,99,235,0.06);}

#loginWrap{text-align:center;padding:60px 20px;}
#mainApp{display:none;}
.user-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;color:var(--text-secondary);}
</style>
</head>
<body>

<div id="loginWrap">
  <div class="app-header" style="max-width:400px;margin:0 auto 24px auto;">
    <h1>浚鍵管理有限公司</h1>
    <p>西鐵小巴營運收支結算系統</p>
  </div>
  <p id="fbLoginStatus" style="font-size:14px;margin-bottom:16px;color:#64748b;">🔄 初始化 Firebase...</p>
  <button class="btn btn-google" onclick="signInGoogle()">🔐 Google 帳號登入</button>
</div>

<div id="mainApp">
  <div class="app-header">
    <h1>浚鍵管理有限公司</h1>
    <p>西鐵小巴每月營運收支結算系統</p>
  </div>

  <div class="user-bar">
    <span id="userInfo">👤 使用者</span>
    <button class="btn btn-warning" style="padding:6px 12px;font-size:12px;" onclick="signOut()">登出</button>
  </div>

  <div class="card" style="padding:10px 16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span id="fbStatus" style="font-size:13px;color:#059669;font-weight:600;">✅ Firebase 雲端連接正常</span>
      <button class="btn btn-theme" style="width:auto;padding:6px 12px;font-size:12px;" onclick="toggleTheme()">🌓 模式切換</button>
    </div>
  </div>

  <!-- 月份選擇 -->
  <div class="card">
    <div class="card-title">📅 結算月份選擇</div>
    <div class="month-selector">
      <input type="month" id="selMonth" onchange="loadMonthData()">
      <button class="btn btn-primary" onclick="loadMonthData()">載入數據</button>
    </div>
  </div>

  <!-- 收入明細 -->
  <div class="card section-income">
    <div class="card-title">💰 收入明細 (Income)</div>
    <div class="grid-2">
      <div class="input-group">
        <label>早間司機收入</label>
        <input type="number" min="0" id="inMorning" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>夜間司機收入</label>
        <input type="number" min="0" id="inNight" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label>特間 (全間) 司機收入</label>
        <input type="number" min="0" id="inSpecial" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>現金收款</label>
        <input type="number" min="0" id="inCash" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
    </div>
    
    <div class="input-group" style="margin-top:6px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <label style="margin:0;font-weight:700;color:var(--income-text);">💳 八達通收款總額</label>
        <button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" onclick="toggleOctopusGrid()">📅 展開/收起 1~31日明細</button>
      </div>
      <input type="number" min="0" id="inOctopus" placeholder="可直接輸入總額，或填寫下方每日明細" oninput="calcAll()">
      
      <div id="octopusBox" style="display:none;">
        <p style="font-size:12px;color:var(--text-secondary);margin-top:6px;">💡 提示：填寫每日八達通金額後，系統會自動加總填入總額。</p>
        <div class="daily-grid" id="octopusGrid"></div>
      </div>
    </div>

    <div class="sum-box income-box">
      <span>收入小計 (Total Income)</span>
      <span>HK$ <span id="subIncome">0.00</span></span>
    </div>
  </div>

  <!-- 支出明細 -->
  <div class="card section-exp">
    <div class="card-title">💸 支出明細 (Expenses)</div>
    
    <!-- 司機人工支出 -->
    <div class="input-group" style="background:var(--exp-bg);padding:10px;border-radius:8px;border:1px dashed var(--exp-border);margin-bottom:12px;">
      <label style="color:var(--exp-text);font-weight:700;">👨‍✈️ 司機人工支出</label>
      <input type="number" min="0" id="outSalary" placeholder="輸入司機工資總額" oninput="calcAll()" style="font-weight:bold;font-size:16px;">
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>燃料費 (石油氣)</label>
        <input type="number" min="0" id="outFuel" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>小巴車租</label>
        <input type="number" min="0" id="outRent" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label>車輛維修保養費</label>
        <input type="number" min="0" id="outRepair" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>保險及牌照費</label>
        <input type="number" min="0" id="outInsLicense" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
    </div>
    <div class="grid-2">
      <div class="input-group">
        <label>違例告票罰款</label>
        <input type="number" min="0" id="outTicket" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
      <div class="input-group">
        <label>其他雜項支出</label>
        <input type="number" min="0" id="outOther" placeholder="HK$ 0.00" oninput="calcAll()">
      </div>
    </div>

    <div class="sum-box exp-box">
      <span>支出小計 (Total Expenses)</span>
      <span>HK$ <span id="subExpense">0.00</span></span>
    </div>
  </div>

  <!-- 總結算 Dashboard -->
  <div class="card">
    <div class="card-title">📊 每月營運結算總覽</div>
    <div class="kpi-container">
      <div class="kpi-card kpi-income">
        <div class="kpi-title">總收入</div>
        <div class="kpi-val">HK$ <span id="totalIncome">0.00</span></div>
      </div>
      <div class="kpi-card kpi-exp">
        <div class="kpi-title">總支出</div>
        <div class="kpi-val">HK$ <span id="totalExpense">0.00</span></div>
      </div>
      <div class="kpi-card kpi-profit" id="kpiProfitBox">
        <div class="kpi-title">本月淨盈虧</div>
        <div class="kpi-val">HK$ <span id="netProfit">0.00</span></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <button class="btn btn-success" onclick="saveCurrent()">💾 儲存本月數據</button>
      <button class="btn btn-excel" onclick="exportProfessionalExcel()">📊 匯出專業 Excel (.xlsx)</button>
    </div>
  </div>

  <!-- 歷史記錄 -->
  <div class="card">
    <div class="card-title">📜 歷史月份存檔</div>
    <div id="historyList"></div>
  </div>
</div>
<script>
// ========== Firebase SDK 配置 ==========
const firebaseConfig = {
  apiKey: "AIzaSyA2t2wqnJX8orbm99cfKW1BXb8yI6ZJdv8",
  authDomain: "minibus-operation-system.firebaseapp.com",
  databaseURL: "https://minibus-operation-system-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "minibus-operation-system",
  storageBucket: "minibus-operation-system.firebasestorage.app",
  messagingSenderId: "744623977021",
  appId: "1:744623977021:web:36dc766e42d2681c9e7054",
  measurementId: "G-Q68FT09T7Q"
};

let app, auth, db, analytics;
let firebaseReady = false;

// 八達通 1~31 日動態產生
(function initOctopusGrid(){
  const grid = document.getElementById('octopusGrid');
  grid.innerHTML = '';
  for(let day = 1; day <= 31; day++){
    const div = document.createElement('div');
    div.className = 'daily-item';
    div.innerHTML = `
      <label>${day} 號 ($)</label>
      <input type="number" min="0" id="oct_day_${day}" placeholder="0" oninput="calcOctopusDaily()">
    `;
    grid.appendChild(div);
  }
})();

function toggleOctopusGrid(){
  const box = document.getElementById('octopusBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function calcOctopusDaily(){
  let total = 0;
  for(let day = 1; day <= 31; day++){
    total += Number(document.getElementById(`oct_day_${day}`).value || 0);
  }
  document.getElementById('inOctopus').value = total > 0 ? total : '';
  calcAll();
}

function applyTheme(isDark){
  isDark ? document.body.classList.add("dark") : document.body.classList.remove("dark");
  localStorage.setItem("minibusTheme", isDark ? "dark" : "light");
}
function toggleTheme(){
  applyTheme(!document.body.classList.contains("dark"));
}
(function loadTheme(){
  const saved = localStorage.getItem("minibusTheme");
  applyTheme(saved === "dark");
})();

const now = new Date();
document.getElementById('selMonth').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

function getPageValues(){
  const octDaily = {};
  for(let day = 1; day <= 31; day++){
    octDaily[`day_${day}`] = Number(document.getElementById(`oct_day_${day}`).value || 0);
  }

  return {
    inMorning: Number(document.getElementById('inMorning').value || 0),
    inNight: Number(document.getElementById('inNight').value || 0),
    inSpecial: Number(document.getElementById('inSpecial').value || 0),
    inOctopus: Number(document.getElementById('inOctopus').value || 0),
    inCash: Number(document.getElementById('inCash').value || 0),

    outSalary: Number(document.getElementById('outSalary').value || 0),
    outFuel: Number(document.getElementById('outFuel').value || 0),
    outRent: Number(document.getElementById('outRent').value || 0),
    outRepair: Number(document.getElementById('outRepair').value || 0),
    outInsLicense: Number(document.getElementById('outInsLicense').value || 0),
    outTicket: Number(document.getElementById('outTicket').value || 0),
    outOther: Number(document.getElementById('outOther').value || 0),

    octDaily: octDaily
  };
}

function calcAll(){
  const d = getPageValues();
  const subIncome = d.inMorning + d.inNight + d.inSpecial + d.inOctopus + d.inCash;
  const subExpense = d.outSalary + d.outFuel + d.outRent + d.outRepair + d.outInsLicense + d.outTicket + d.outOther;
  const net = subIncome - subExpense;

  document.getElementById('subIncome').textContent = subIncome.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('subExpense').textContent = subExpense.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('totalIncome').textContent = subIncome.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('totalExpense').textContent = subExpense.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('netProfit').textContent = net.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});

  const kpiProfit = document.getElementById('kpiProfitBox');
  if(net >= 0){
    kpiProfit.style.background = "var(--income-bg)";
    kpiProfit.style.color = "var(--income-text)";
    kpiProfit.style.borderColor = "var(--income-border)";
  } else {
    kpiProfit.style.background = "var(--exp-bg)";
    kpiProfit.style.color = "var(--exp-text)";
    kpiProfit.style.borderColor = "var(--exp-border)";
  }
}

const LOCAL_KEY = "minibusAccountsLocal";
function localGetAll(){
  const raw = localStorage.getItem(LOCAL_KEY);
  return raw ? JSON.parse(raw) : {};
}
function localSaveMonth(monthKey, data){
  const all = localGetAll();
  all[monthKey] = data;
  localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
}
function localLoadMonth(monthKey){
  const all = localGetAll();
  return all[monthKey] || {};
}

window.addEventListener('load', function(){
  if(typeof firebase !== "undefined"){
    app = firebase.initializeApp(firebaseConfig);
    auth = firebase.auth(app);
    db = firebase.database(app);
    analytics = firebase.analytics(app);

    auth.onAuthStateChanged(user => {
      if(user){
        document.getElementById("loginWrap").style.display = "none";
        document.getElementById("mainApp").style.display = "block";
        document.getElementById("userInfo").textContent = `👤 ${user.displayName || '管理員'} (${user.email || ''})`;
        firebaseReady = true;
        document.getElementById("fbStatus").textContent = "✅ Firebase 雲端連接正常";
        loadMonthData();
      }else{
        document.getElementById("loginWrap").style.display = "block";
        document.getElementById("mainApp").style.display = "none";
        firebaseReady = false;
        document.getElementById("fbLoginStatus").textContent = "⚠️ 請使用 Google 帳號登入系統";
      }
    });
  }
});

async function signInGoogle(){
  if(typeof firebase === "undefined") return;
  const provider = new firebase.auth.GoogleAuthProvider();
  try{
    await auth.signInWithPopup(provider);
  }catch(err){
    alert("登入失敗：" + err.message);
  }
}

async function signOut(){
  try{
    await auth.signOut();
  }catch(e){
    alert("登出異常：" + e.message);
  }
}

async function loadMonthData(){
  const monthKey = document.getElementById('selMonth').value;
  let d;
  if(firebaseReady){
    try{
      const snapshot = await db.ref("minibusAccounts").child(monthKey).once('value');
      d = snapshot.exists() ? snapshot.val() : localLoadMonth(monthKey);
    }catch(e){
      d = localLoadMonth(monthKey);
    }
  }else{
    d = localLoadMonth(monthKey);
  }

  document.getElementById('inMorning').value = d.inMorning || '';
  document.getElementById('inNight').value = d.inNight || '';
  document.getElementById('inSpecial').value = d.inSpecial || '';
  document.getElementById('inOctopus').value = d.inOctopus || '';
  document.getElementById('inCash').value = d.inCash || '';

  document.getElementById('outSalary').value = d.outSalary || '';
  document.getElementById('outFuel').value = d.outFuel || '';
  document.getElementById('outRent').value = d.outRent || '';
  document.getElementById('outRepair').value = d.outRepair || '';
  document.getElementById('outInsLicense').value = d.outInsLicense || '';
  document.getElementById('outTicket').value = d.outTicket || '';
  document.getElementById('outOther').value = d.outOther || '';

  const octDaily = d.octDaily || {};
  for(let day = 1; day <= 31; day++){
    document.getElementById(`oct_day_${day}`).value = octDaily[`day_${day}`] || '';
  }

  calcAll();
  renderHistory();
}

async function saveCurrent(){
  const monthKey = document.getElementById('selMonth').value;
  const payload = getPageValues();
  localSaveMonth(monthKey, payload);
  if(firebaseReady){
    try{
      await db.ref("minibusAccounts").child(monthKey).set(payload);
      alert("✅ 已成功儲存本月數據至雲端！");
    }catch(err){
      alert("⚠️ 雲端儲存失敗，已保存本機：" + err.message);
    }
  }else{
    alert("✅ 已儲存至本機");
  }
  renderHistory();
}

async function renderHistory(){
  const listDom = document.getElementById('historyList');
  listDom.innerHTML = "<div style='color:var(--text-secondary);padding:8px;'>讀取中...</div>";
  let cloudData = {};
  if(firebaseReady){
    try{
      const snap = await db.ref("minibusAccounts").once('value');
      cloudData = snap.val() || {};
    }catch(e){}
  }
  const localData = localGetAll();
  const merged = {...localData, ...cloudData};
  listDom.innerHTML = "";
  
  const keys = Object.keys(merged).sort().reverse();
  if(keys.length === 0){
    listDom.innerHTML = "<div style='color:var(--text-secondary);padding:8px;'>暫無記錄</div>";
    return;
  }
  keys.forEach(k => {
    const d = merged[k];
    const inc = (d.inMorning||0)+(d.inNight||0)+(d.inSpecial||0)+(d.inOctopus||0)+(d.inCash||0);
    const exp = (d.outSalary||0)+(d.outFuel||0)+(d.outRent||0)+(d.outRepair||0)+(d.outInsLicense||0)+(d.outTicket||0)+(d.outOther||0);
    const net = inc - exp;
    const div = document.createElement('div');
    div.className = "history-item";
    div.innerHTML = `
      <div><strong>${k}</strong></div>
      <div>收入: $${inc.toFixed(0)} ｜ 支出: $${exp.toFixed(0)} ｜ <span style="font-weight:bold;color:${net>=0?'#059669':'#dc2626'}">淨額: $${net.toFixed(0)}</span></div>
    `;
    div.onclick = () => {
      document.getElementById('selMonth').value = k;
      loadMonthData();
    }
    listDom.appendChild(div);
  });
}

// 專業版 Excel 匯出 (.xlsx)
async function exportProfessionalExcel(){
  let cloudData = {};
  if(firebaseReady){
    try{
      const snap = await db.ref("minibusAccounts").once('value');
      cloudData = snap.val() || {};
    }catch(e){}
  }
  const localData = localGetAll();
  const all = {...localData, ...cloudData};

  // 1. 每月收支總表 Sheet
  const summaryHeaders = [
    ["浚鍵管理有限公司 ｜ 西鐵小巴營運收支結算表"],
    ["月份", "早間車資", "夜間車資", "特間車資", "八達通總額", "現金收款", "總收入", "司機人工", "燃料(石油氣)", "車租", "維修保養", "保險牌費", "違例告票", "其他雜項", "總支出", "淨盈虧"]
  ];

  const summaryRows = [];
  Object.keys(all).sort().forEach(k => {
    const d = all[k];
    const inc = (d.inMorning||0)+(d.inNight||0)+(d.inSpecial||0)+(d.inOctopus||0)+(d.inCash||0);
    const exp = (d.outSalary||0)+(d.outFuel||0)+(d.outRent||0)+(d.outRepair||0)+(d.outInsLicense||0)+(d.outTicket||0)+(d.outOther||0);
    const net = inc - exp;
    summaryRows.push([
      k,
      d.inMorning||0, d.inNight||0, d.inSpecial||0, d.inOctopus||0, d.inCash||0, inc,
      d.outSalary||0, d.outFuel||0, d.outRent||0, d.outRepair||0, d.outInsLicense||0, d.outTicket||0, d.outOther||0, exp,
      net
    ]);
  });

  const ws_summary = XLSX.utils.aoa_to_sheet(summaryHeaders.concat(summaryRows));
  ws_summary['!cols'] = [
    {wch: 12}, {wch: 12}, {wch: 12}, {wch: 12}, {wch: 14}, {wch: 12}, {wch: 14},
    {wch: 14}, {wch: 13}, {wch: 12}, {wch: 12}, {wch: 12}, {wch: 12}, {wch: 12}, {wch: 14},
    {wch: 15}
  ];

  // 2. 當月八達通每日 Sheet
  const curMonth = document.getElementById('selMonth').value;
  const curData = all[curMonth] || getPageValues();
  const octDaily = curData.octDaily || {};
  
  const dailyHeaders = [
    [`${curMonth} 八達通 1~31 日每日明細記錄`],
    ["日期", "八達通金額 (HKD)"]
  ];
  const dailyRows = [];
  for(let day = 1; day <= 31; day++){
    dailyRows.push([`${day} 號`, octDaily[`day_${day}`] || 0]);
  }
  const ws_daily = XLSX.utils.aoa_to_sheet(dailyHeaders.concat(dailyRows));
  ws_daily['!cols'] = [{wch: 15}, {wch: 22}];

  // 建立活頁簿
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws_summary, "每月營運總表");
  XLSX.utils.book_append_sheet(wb, ws_daily, "八達通每日明細");

  // 儲存檔案
  XLSX.writeFile(wb, `浚鍵管理有限公司_西鐵小巴營運收支表_${curMonth}.xlsx`);
}
